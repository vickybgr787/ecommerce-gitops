apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: user-service-dev
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/vickybgr787/ecommerce-platform.git
    targetRevision: main
    path: helm/user-service

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
