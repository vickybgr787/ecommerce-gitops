apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frontend-dev
  namespace: argocd

spec:
  project: default

  sources:
    - repoURL: https://github.com/vickybgr787/ecommerce-platform.git
      targetRevision: main
      path: helm/frontend
      helm:
        valueFiles:
          - $values/environments/dev/frontend-values.yaml

    - repoURL: https://github.com/vickybgr787/ecommerce-gitops.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
