apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-dev
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/vickybgr787/ecommerce-platform.git
    targetRevision: main
    path: k8s/ingress

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
